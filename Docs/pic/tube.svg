<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 600" width="200" height="600">
  <ellipse cx="100" cy="585" rx="68" ry="10" fill="rgba(0,0,0,0.18)"/>
  <ellipse cx="100" cy="583" rx="50" ry="6" fill="rgba(0,0,0,0.10)"/>

  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(180,215,240,0.85)"/>
      <stop offset="15%" stop-color="rgba(240,250,255,0.95)"/>
      <stop offset="45%" stop-color="rgba(200,225,245,0.55)"/>
      <stop offset="75%" stop-color="rgba(240,250,255,0.85)"/>
      <stop offset="100%" stop-color="rgba(180,215,240,0.85)"/>
    </linearGradient>

    <linearGradient id="neckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8aa8c0"/>
      <stop offset="50%" stop-color="#c8dceb"/>
      <stop offset="100%" stop-color="#8aa8c0"/>
    </linearGradient>

    <radialGradient id="bottomGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(140,175,205,0.5)"/>
      <stop offset="100%" stop-color="rgba(140,175,205,0.1)"/>
    </radialGradient>
  </defs>

  <!-- ГОРЛЫШКО (тонкий цилиндр) -->
  <rect x="72" y="30" width="56" height="24" rx="4" fill="url(#glassGrad)" stroke="#8aa8c0" stroke-width="2.5"/>

  <!-- ОБОДОК ГОРЛЫШКА -->
  <rect x="66" y="20" width="68" height="14" rx="7" fill="url(#neckGrad)" stroke="#6e8fa8" stroke-width="2"/>

  <!-- ОСНОВНОЕ ТЕЛО -->
  <path d="M 55 56
           Q 55 52, 62 52
           L 138 52
           Q 145 52, 145 56
           L 145 530
           Q 145 560, 100 560
           Q 55 560, 55 530
           Z"
        fill="url(#glassGrad)" stroke="#8aa8c0" stroke-width="2.5"/>

  <!-- БЛИК СЛЕВА -->
  <path d="M 68 70
           Q 66 70, 66 75
           L 66 520
           Q 66 525, 70 525
           L 72 525
           Q 74 525, 74 520
           L 74 75
           Q 74 70, 72 70
           Z"
        fill="rgba(255,255,255,0.75)"/>

  <!-- БЛИК СПРАВА -->
  <path d="M 130 90 L 134 90 L 134 500 L 130 500 Z" fill="rgba(255,255,255,0.45)"/>

  <!-- ДНО -->
  <ellipse cx="100" cy="550" rx="43" ry="9" fill="url(#bottomGrad)"/>

  <!-- ВНУТРЕННЯЯ ТЕНЬ СВЕРХУ -->
  <ellipse cx="100" cy="58" rx="38" ry="4" fill="rgba(140,175,205,0.35)"/>
</svg>