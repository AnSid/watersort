<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100">
  <defs>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a7ba8"/>
      <stop offset="20%" stop-color="#7fb2d8"/>
      <stop offset="50%" stop-color="#a8d0e8"/>
      <stop offset="80%" stop-color="#7fb2d8"/>
      <stop offset="100%" stop-color="#4a7ba8"/>
    </linearGradient>
    <linearGradient id="capTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a8bb8"/>
      <stop offset="50%" stop-color="#b8ddf0"/>
      <stop offset="100%" stop-color="#5a8bb8"/>
    </linearGradient>
  </defs>

  <!-- ОСНОВАНИЕ КРЫШКИ -->
  <rect x="55" y="30" width="90" height="55" rx="8" fill="url(#capGrad)" stroke="#3a5f80" stroke-width="2.5"/>

  <!-- ВЕРХ КРЫШКИ (чуть шире) -->
  <rect x="50" y="15" width="100" height="25" rx="10" fill="url(#capTopGrad)" stroke="#3a5f80" stroke-width="2.5"/>

  <!-- ВЕРХНИЙ БЛИК -->
  <ellipse cx="100" cy="27" rx="40" ry="7" fill="rgba(255,255,255,0.55)"/>

  <!-- НИЖНЯЯ ТЕНЬ -->
  <ellipse cx="100" cy="83" rx="42" ry="4" fill="rgba(0,0,0,0.25)"/>
</svg>